services:
  - type: web
    name: smile-crms-backend
    env: docker
    plan: standard
    
    # Environment variables
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: smile-crms-db
          property: connectionString
    
    # Health check
    healthCheckPath: /health

  - type: pserv
    name: smile-crms-db
    env: postgres
    plan: standard
    
    # Database configuration
    postgresSQLVersion: "15"
    
    # Database variables
    envVars:
      - key: POSTGRES_DB
        value: smile_crms
      - key: POSTGRES_USER
        value: smile_admin
      - key: POSTGRES_PASSWORD
        generateValue: true
